# InfraHub console nginx configuration
# Serves the Vue 3 SPA build and reverse-proxies API traffic to the backend
# container. Runs inside the frontend image; the backend is reached by the
# compose service name `backend` on its internal port.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- API reverse proxy ----
    # The frontend calls absolute /api/... paths (axios baseURL '/', same as the
    # Vite dev proxy in vite.config.ts). proxy_pass without a URI suffix keeps
    # the full request URI, i.e. the /api prefix is preserved for the backend.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Health endpoint passthrough (same probe path as the backend image) ----
    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}