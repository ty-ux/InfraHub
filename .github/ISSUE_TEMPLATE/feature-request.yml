name: 功能建议
description: 提议新的功能或改进现有操作流程
body:
  - type: textarea
    id: use_case
    attributes:
      label: 使用场景与问题
      description: 你在使用哪个功能，遇到了什么困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的改进
      description: 描述期望的操作流程或结果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方案
      description: 可以补充临时做法、相关 Issue 或脱敏截图
