# InfraHub backend sensitive configuration - EXAMPLE TEMPLATE ONLY (V2 Stage X P2 deliverables).
# All values below are REPLACE_ME placeholders. Copy to secret.yaml (or create via
# kubectl create secret) and substitute real values before applying to any environment.
# INFRAHUB_JWT_SECRET must be a strong secret (>= 32 bytes for HS256).
apiVersion: v1
kind: Secret
metadata:
  name: infrahub-backend-secret
  labels:
    app: infrahub-backend
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: REPLACE_ME_DB_USERNAME
  SPRING_DATASOURCE_PASSWORD: REPLACE_ME_DB_PASSWORD
  INFRAHUB_JWT_SECRET: REPLACE_ME_JWT_SECRET