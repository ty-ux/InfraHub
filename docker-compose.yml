# InfraHub - Docker Compose orchestration (PostgreSQL + backend + frontend)
#
# Usage:
#   cp deploy/.env.example .env        (required; fill in both credentials)
#   docker compose up -d --build       (project name: use -p to fix isolation)
#   docker compose down                (stop, keep the database volume)
#   docker compose down -v             (stop AND delete the database volume)
#
# Security notes:
#   - Set fresh credentials before running this Compose project.
#     Supply POSTGRES_PASSWORD and JWT_SECRET via .env / host environment.
#   - No real credentials, JWT keys or tokens are committed in this file.
#   - The database is not published to the host by default. For local debugging
#     only, expose it by adding to `postgres`:
#        ports:
#          - "${POSTGRES_EXPOSE_PORT:-5432}:5432"
#
# Postgres bootstrap: db/bootstrap mounts each script explicitly, in order
# (files run alphabetically inside the container). 00-create-database.sql is
# deliberately NOT mounted - the database is created by POSTGRES_DB.
# 03-db-acceptance.sql is mapped to 99-db-acceptance.sql so it runs LAST,
# after the 04-* increments, matching "acceptance last" semantics.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infrahub}
      POSTGRES_USER: ${POSTGRES_USER:-infrahub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Bootstrap scripts, explicit order (container executes them alphabetically):
      - ./db/bootstrap/00-post-create-database.sql:/docker-entrypoint-initdb.d/00-post-create-database.sql:ro
      - ./db/bootstrap/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/bootstrap/02-init-data.sql:/docker-entrypoint-initdb.d/02-init-data.sql:ro
      - ./db/bootstrap/02-repair-identity-sequences.sql:/docker-entrypoint-initdb.d/02-repair-identity-sequences.sql:ro
      - ./db/bootstrap/04-01-add-missing-tables.sql:/docker-entrypoint-initdb.d/04-01-add-missing-tables.sql:ro
      - ./db/bootstrap/04-02-add-missing-columns.sql:/docker-entrypoint-initdb.d/04-02-add-missing-columns.sql:ro
      - ./db/bootstrap/04-03-add-missing-indexes-constraints.sql:/docker-entrypoint-initdb.d/04-03-add-missing-indexes-constraints.sql:ro
      - ./db/bootstrap/04-04-add-missing-reference-data.sql:/docker-entrypoint-initdb.d/04-04-add-missing-reference-data.sql:ro
      - ./db/bootstrap/04-05-add-missing-tables-acceptance.sql:/docker-entrypoint-initdb.d/04-05-add-missing-tables-acceptance.sql:ro
      # Base acceptance check runs LAST (mapped with a high prefix):
      - ./db/bootstrap/03-db-acceptance.sql:/docker-entrypoint-initdb.d/99-db-acceptance.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infrahub} -d ${POSTGRES_DB:-infrahub}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - infrahub-network

  backend:
    build:
      context: .
      dockerfile: infrahub-web/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-infrahub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-infrahub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SPRING_FLYWAY_ENABLED: "false"
      INFRAHUB_JWT_ISSUER: ${JWT_ISSUER:-infrahub}
      # LOCAL-DEVELOPMENT placeholder only; production MUST override JWT_SECRET.
      INFRAHUB_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      INFRAHUB_JWT_EXPIRE_SECONDS: ${JWT_EXPIRE_SECONDS:-7200}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - infrahub-network

  frontend:
    build:
      context: .
      dockerfile: infrahub-console/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8088}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - infrahub-network

volumes:
  postgres-data:

networks:
  infrahub-network:
    driver: bridge